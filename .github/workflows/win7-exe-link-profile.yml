name: Win7 executable link profile

on:
  pull_request:
    paths:
      - .github/workflows/win7-exe-link-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      RUSTFLAGS: -C debuginfo=line-tables-only -C target-feature=+crt-static
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
      SCCACHE_GHA_VERSION: win7-webview2-1.0.902.49-v1
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for Windows 7
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      - name: Prepare Win7-compatible WebView2 loader
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-loader.ps1

      - name: Prepare WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Build frontend
        run: pnpm build

      - name: Warm Rust library and dependencies
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
            --config .github/fixtures/win7-host-repro-config.toml `
            build --locked --package dbx --lib --release --features custom-protocol `
            --target x86_64-win7-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure executable and record linker
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          $resultRoot = Join-Path $env:RUNNER_TEMP "dbx-exe-link-profile"
          $profileDir = Join-Path $resultRoot "self-profile"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          $results = @{}

          function Measure-Executable([string] $name, [string[]] $extraArgs) {
            $logPath = Join-Path $resultRoot "$name-cargo-vv.log"
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            & cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
              --config .github/fixtures/win7-host-repro-config.toml `
              rustc -vv --locked --package dbx --bin dbx --release `
              --features custom-protocol --target x86_64-win7-windows-msvc --timings `
              -- @extraArgs --print link-args 2>&1 |
              Tee-Object -FilePath $logPath | Out-Null
            $exitCode = $LASTEXITCODE
            $timer.Stop()
            if ($exitCode -ne 0) { throw "$name executable build failed with exit code $exitCode." }
            if (Select-String -LiteralPath $logPath -Pattern '--crate-name dbx_lib' -SimpleMatch -Quiet) {
              throw "$name build rebuilt dbx_lib and did not isolate the executable."
            }

            $linkLine = Select-String -LiteralPath $logPath -Pattern '^"[^"]*(?:link|lld-link)\.exe"\s' |
              Select-Object -Last 1
            if (!$linkLine) { throw "$name build did not print a linker command." }
            $linkCommand = $linkLine.Line
            $linkCommand | Set-Content -LiteralPath (Join-Path $resultRoot "$name-link-args.txt") -Encoding utf8NoBOM
            $linker = ($linkCommand -split '"')[1]
            $results[$name] = @{
              seconds = [math]::Round($timer.Elapsed.TotalSeconds, 2)
              linker = $linker
            }
            Write-Host "$name executable: $($results[$name].seconds) seconds; linker: $linker"
            Remove-Item -LiteralPath $logPath
          }

          Measure-Executable "baseline" @()
          Measure-Executable "self-profile" @("-Zself-profile=$profileDir")

          if (!(Get-ChildItem -LiteralPath $profileDir -File | Select-Object -First 1)) {
            throw "The executable build did not write Self Profile data."
          }
          $results | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $resultRoot "summary.json") -Encoding utf8NoBOM
          @(
            "### Win7 dbx.exe link profile"
            ""
            "| Build | Rustc and linker wall time | Linker |"
            "| --- | ---: | --- |"
            "| Baseline | $($results['baseline'].seconds) s | ``$($results['baseline'].linker)`` |"
            "| Self Profile | $($results['self-profile'].seconds) s | ``$($results['self-profile'].linker)`` |"
            ""
            "Both builds use the Win7 CI release profile. The second build adds Self Profile only."
            "The artifact contains the full linker command and raw Self Profile data."
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload executable profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DBX-win7-exe-link-profile
          path: |
            ${{ runner.temp }}/dbx-exe-link-profile/
            target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7
