name: Win7 LLVM IR hotspots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/win7-llvm-ir-hotspots.yml

permissions:
  contents: read

jobs:
  llvm-ir-hotspots:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      RUSTFLAGS: -C debuginfo=line-tables-only -C target-feature=+crt-static
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
      SCCACHE_GHA_VERSION: win7-webview2-1.0.902.49-v1
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for Windows 7
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src, llvm-tools-preview

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      - name: Prepare Win7-compatible WebView2 loader
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-loader.ps1

      - name: Prepare WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Build frontend
        run: pnpm build

      - name: Warm Rust dependencies
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
            --config .github/fixtures/win7-host-repro-config.toml `
            build --locked --package dbx --lib --release --features custom-protocol `
            --target x86_64-win7-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture dbx library LLVM IR and Self Profile
        shell: pwsh
        run: |
          $env:RUSTC_WRAPPER = ""
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          $profileDir = Join-Path $env:RUNNER_TEMP "dbx-lib-llvm-profile"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          cargo clean --package dbx --release --target x86_64-win7-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
            --config .github/fixtures/win7-host-repro-config.toml `
            rustc --locked --package dbx --lib --release --features custom-protocol `
            --target x86_64-win7-windows-msvc --timings `
            -- -Csave-temps "-Zself-profile=$profileDir" "-Zself-profile-events=default,llvm"
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          if ($exitCode -ne 0) { exit $exitCode }
          $bitcode = @(Get-ChildItem -LiteralPath target/x86_64-win7-windows-msvc/release/deps `
            -Filter 'dbx_lib-*.no-opt.bc' -File)
          if ($bitcode.Count -eq 0) { throw "rustc did not retain dbx_lib unoptimized bitcode." }
          $rlib = Get-ChildItem -LiteralPath target/x86_64-win7-windows-msvc/release/deps `
            -Filter 'libdbx_lib-*.rlib' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$rlib) { throw "dbx_lib rlib is missing." }
          [pscustomobject]@{
            commit = (git rev-parse HEAD).Trim()
            rustc = (rustc -vV | Out-String).Trim()
            seconds_with_instrumentation = [math]::Round($timer.Elapsed.TotalSeconds, 2)
            bitcode_files = $bitcode.Count
            bitcode_bytes = ($bitcode | Measure-Object Length -Sum).Sum
            rlib_bytes = $rlib.Length
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $profileDir 'metadata.json')

      - name: Count LLVM IR lines by function
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP "dbx-lib-llvm-profile"
          $sysroot = (rustc --print sysroot).Trim()
          $llvmDis = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-dis.exe'
          if (!(Test-Path -LiteralPath $llvmDis)) { throw "llvm-dis.exe is missing from llvm-tools-preview." }
          $irDir = Join-Path $env:RUNNER_TEMP 'dbx-lib-llvm-ir'
          New-Item -ItemType Directory -Force -Path $irDir | Out-Null
          $bitcode = @(Get-ChildItem -LiteralPath target/x86_64-win7-windows-msvc/release/deps `
            -Filter 'dbx_lib-*.no-opt.bc' -File)
          foreach ($file in $bitcode) {
            $output = Join-Path $irDir ($file.BaseName + '.ll')
            & $llvmDis -o $output $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'cargo-llvm-lines'
          cargo install --locked --root $installRoot cargo-llvm-lines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $installRoot 'bin') + [IO.Path]::PathSeparator + $env:PATH
          $irFiles = @(Get-ChildItem -LiteralPath $irDir -Filter '*.ll' -File | ForEach-Object FullName)
          if ($irFiles.Count -ne $bitcode.Count) { throw "LLVM IR file count does not match bitcode count." }
          $report = Join-Path $profileDir 'llvm-lines.txt'
          cargo llvm-lines --files $irFiles | Set-Content -LiteralPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $report).Length -eq 0) { throw "cargo-llvm-lines wrote an empty report." }
          cargo llvm-lines --version | Set-Content -LiteralPath (Join-Path $profileDir 'llvm-lines-version.txt')
          @('### Win7 dbx_lib LLVM IR lines', '', '```text') +
            @(Get-Content -LiteralPath $report -TotalCount 35) +
            @('```', '', 'IR line counts rank generated functions. They do not measure LLVM CPU time.') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Remove-Item -LiteralPath $irDir -Recurse -Force

      - name: Summarize Self Profile
        continue-on-error: true
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP "dbx-lib-llvm-profile"
          $installRoot = Join-Path $env:RUNNER_TEMP "measureme"
          cargo install --git https://github.com/rust-lang/measureme --branch stable `
            --locked --root $installRoot summarize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profile = Get-ChildItem -LiteralPath $profileDir -File -Filter "dbx_lib-*.mm_profdata" |
            Select-Object -First 1
          if (!$profile) { throw "dbx_lib Self Profile data is missing." }
          $summaryPath = Join-Path $profileDir "summary.txt"
          & (Join-Path $installRoot "bin/summarize.exe") summarize $profile.FullName |
            Tee-Object -FilePath $summaryPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload LLVM IR hotspot report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DBX-win7-llvm-ir-hotspots
          path: |
            ${{ runner.temp }}/dbx-lib-llvm-profile/
            target/cargo-timings/
          if-no-files-found: warn
          retention-days: 3
