name: Win7 four codegen units A/B

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/win7-four-codegen-units-ab.yml

permissions:
  contents: read

jobs:
  library-codegen-units:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -C debuginfo=line-tables-only -C target-feature=+crt-static
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for Windows 7
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src

      - name: Prepare Win7-compatible WebView2 loader
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-loader.ps1

      - name: Prepare WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Build frontend
        run: pnpm build

      - name: Compare dbx library codegen units
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          $reportDir = Join-Path $env:RUNNER_TEMP 'dbx-codegen-units-ab'
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $variants = @(
            @{ Name = 'warmup-8'; Units = 8 },
            @{ Name = 'candidate-4'; Units = 4 },
            @{ Name = 'candidate-4-repeat'; Units = 4 },
            @{ Name = 'control-8'; Units = 8 }
          )
          $results = @()
          foreach ($variant in $variants) {
            cargo clean --package dbx --release --target x86_64-win7-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $logFile = Join-Path $reportDir "$($variant.Name).log"
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
              --config .github/fixtures/win7-host-repro-config.toml `
              rustc --locked --package dbx --lib --release --features custom-protocol `
              --target x86_64-win7-windows-msvc -- "-Ccodegen-units=$($variant.Units)" `
              2>&1 | Tee-Object -FilePath $logFile
            $exitCode = $LASTEXITCODE
            $timer.Stop()
            if ($exitCode -ne 0) { exit $exitCode }
            $compiled = @(Select-String -LiteralPath $logFile -Pattern '^\s*Compiling\s+(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value })
            if ($variant.Name -in @('control-8', 'candidate-4-repeat') -and
                ($compiled.Count -ne 1 -or $compiled[0] -ne 'dbx')) {
              throw "The $($variant.Name) pass rebuilt packages outside dbx: $($compiled -join ', ')."
            }

            $rlib = Get-ChildItem -LiteralPath target/x86_64-win7-windows-msvc/release/deps `
              -Filter 'libdbx_lib-*.rlib' -File |
              Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if (!$rlib) { throw "The $($variant.Name) build did not create dbx_lib." }
            $results += [pscustomobject]@{
              name = $variant.Name
              codegen_units = $variant.Units
              seconds = [math]::Round($timer.Elapsed.TotalSeconds, 2)
              rlib_bytes = $rlib.Length
              compiled_packages = $compiled.Count
            }
            $results | ConvertTo-Json -Depth 3 |
              Set-Content -LiteralPath (Join-Path $reportDir 'results.json')
          }

          @(
            '### Win7 dbx_lib codegen units',
            '',
            '| Pass | Units | Command seconds | rlib bytes | Compiled packages |',
            '| --- | ---: | ---: | ---: | ---: |'
          ) + @($results | ForEach-Object {
            "| $($_.name) | $($_.codegen_units) | $($_.seconds) | $($_.rlib_bytes) | $($_.compiled_packages) |"
          }) + @(
            '',
            'The first pass builds dependencies. Compare candidate-4-repeat with control-8.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload codegen units report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DBX-win7-four-codegen-units-ab
          path: ${{ runner.temp }}/dbx-codegen-units-ab/results.json
          if-no-files-found: warn
          retention-days: 1
